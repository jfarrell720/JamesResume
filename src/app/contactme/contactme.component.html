<div class="email-form">
    <h2>Contact Me</h2>
    <form class="contact-form" (submit)="sendEmail($event)">
      <label for="user_name">Name</label>
      <input type="text" id="user_name" name="user_name" [(ngModel)]="userName" required>
  
      <label for="user_email">Email</label>
      <input type="email" id="user_email" name="user_email" [(ngModel)]="userEmail" required>
  
      <label for="message">Message</label>
      <textarea id="message" name="message" [(ngModel)]="message" required></textarea>
  
      <input type="submit" value="Send">
    </form>
  </div>
